# Push a tag to release:
#   git tag v0.2.0 && git push origin v0.2.0
# This runs the tests, packs the npm tarball, publishes a GitHub Release with it, publishes to npm
# (when enabled, see the "Publish to npm" step) and adds the version to the channel manifest(s) on
# the default branch.
#
# Users always get stable by default (npm "latest", GitHub "Latest release", manifest.json).
# Experimental builds are opt-in, at the user's own risk: npm i -g server-health-tracker@experimental
#
# Channels (same model as Movie Curator):
#   v0.2.0         stable        -> npm "latest",       added to manifest.json and manifest-experimental.json
#   v0.2.0-exp.3   experimental  -> npm "experimental", GitHub pre-release, manifest-experimental.json only
#                  (-beta.N and -dev.N work the same; the number must be >= 1)
#   npm/semver note: 0.2.0-exp.3 sorts BEFORE 0.2.0, so name experiments after the version they lead up to.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # GitHub Release + manifest commit
  id-token: write   # npm provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the changelog lists the commits since the previous tag

      # No registry-url here: setup-node would write an .npmrc with an (empty) token that can
      # keep npm from using trusted publishing. Auth is set up in the publish step instead.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$v" in
            *-*)
              n="${v##*[!0-9]}"
              if [ -z "$n" ] || [ "$n" = "0" ]; then echo "::error::Experimental tags need a number >= 1, e.g. v0.2.0-exp.1"; exit 1; fi
              ch=experimental; dist=experimental;;
            *) ch=stable; dist=latest;;
          esac
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Use three numbers, e.g. v0.2.0 or v0.2.0-exp.1"; exit 1
          fi
          npm version "$v" --no-git-tag-version --allow-same-version
          # npm provenance needs repository.url to match this GitHub repo
          if [ -z "$(npm pkg get repository.url | tr -d '{}"')" ]; then
            npm pkg set repository.type=git "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git" \
              "homepage=https://github.com/${GITHUB_REPOSITORY}#readme" "bugs.url=https://github.com/${GITHUB_REPOSITORY}/issues"
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
          echo "CHANNEL=$ch" >> "$GITHUB_ENV"
          echo "DIST_TAG=$dist" >> "$GITHUB_ENV"
          echo "Releasing $v on the $ch channel"

      - name: Test
        run: npm test

      - name: Pack
        run: echo "TGZ=$(npm pack --silent | tail -n 1)" >> "$GITHUB_ENV"

      - name: Changelog
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          git log --no-merges --pretty='%s' ${prev:+$prev..}"$GITHUB_REF_NAME" \
            | grep -v -E '^(manifest|release):' | sed 's/^/- /' | head -n 30 > notes.md || true
          [ -s notes.md ] || echo "- Release" > notes.md
          cat notes.md

      - name: GitHub Release
        run: |
          {
            cat notes.md
            echo
            echo "### Install"
            echo '```sh'
            echo "npm install -g server-health-tracker@${VERSION}"
            echo 'sudo "$(which node)" "$(which sht)" install'
            echo '```'
            echo "sha256 \`$(sha256sum "$TGZ" | cut -d' ' -f1)\`"
          } > release.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release exists (re-run): replacing the asset"
            gh release upload "$GITHUB_REF_NAME" "$TGZ" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$TGZ" --title "sht ${VERSION}" --notes-file release.md \
              $([ "$CHANNEL" = experimental ] && echo --prerelease)
          fi

      - name: Update the channel manifest(s) on the default branch
        run: |
          cp notes.md "$TGZ" "$RUNNER_TEMP/"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"
          node scripts/update-manifest.js "$VERSION" "$GITHUB_REF_NAME" "$CHANNEL" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${TGZ}" \
            "$RUNNER_TEMP/$TGZ" "$RUNNER_TEMP/notes.md"
          if [ "$CHANNEL" = stable ]; then
            npm version "$VERSION" --no-git-tag-version --allow-same-version   # keep package.json at the latest stable
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json manifest-experimental.json package.json
          git commit -m "manifest: ${GITHUB_REF_NAME} (${CHANNEL})" || { echo "manifest unchanged"; exit 0; }
          git push origin "HEAD:$DEFAULT_BRANCH"

      # Publishing is opt-in and runs last, so an npm problem never blocks the GitHub release or manifests.
      # Enable it with the repository variable NPM_PUBLISH=true (trusted publishing, no token)
      # or with an NPM_TOKEN secret. Without either, this step is skipped.
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true' || env.NPM_TOKEN != ''
        run: |
          cd "$GITHUB_WORKSPACE"
          npm install -g npm@latest >/dev/null   # trusted publishing (OIDC) needs npm >= 11.5.1
          echo "npm $(npm --version)"
          if [ -n "$NPM_TOKEN" ]; then
            echo "auth: NPM_TOKEN secret"
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          else
            echo "auth: trusted publishing (OIDC)"
            [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] || echo "::warning::no OIDC token available: the workflow needs 'permissions: id-token: write'"
          fi
          if ! npm publish "$RUNNER_TEMP/$TGZ" --access public --provenance --tag "$DIST_TAG"; then
            echo "---- npm log (oidc / auth) ----"
            grep -h -i -E 'oidc|trusted|auth|token' "$HOME"/.npm/_logs/*.log | tail -n 30 || true
            echo "::error::npm publish failed. For trusted publishing check npmjs.com -> server-health-tracker -> Settings -> Trusted publishing: owner '${GITHUB_REPOSITORY%%/*}', repository '${GITHUB_REPOSITORY#*/}', workflow 'release.yml', no environment. The GitHub release and manifests are already done; re-run this job after fixing."
            exit 1
          fi
